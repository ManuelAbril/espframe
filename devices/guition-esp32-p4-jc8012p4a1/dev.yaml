# =============================================================================
# DEV CONFIG - Local development entry point (Guition ESP32-P4 JC8012P4A1)
# =============================================================================
# Flash with: esphome run dev.yaml
# =============================================================================

substitutions:
  name: "immich-frame-10inch-dev"
  friendly_name: "Immich Frame 10inch Dev"
  espframe_component_url: "../.."
  espframe_component_ref: "HEAD"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  espframe: !include packages.yaml

web_server:
  port: 80
  version: 3
  js_url: ""
  css_include: "../../docs/public/webserver/style.css"
  js_include: "../../docs/public/webserver/app.js"

